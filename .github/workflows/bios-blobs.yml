name: BIOS Boot Blobs

# Builds the GRUB stage1/stage2 blobs that the app embeds (assets/grub) and **verifies them by
# booting a disk image in QEMU/SeaBIOS** (serial output must contain MIRRORBOX-GRUB-BOOT-OK).
#
# Run manually, then download the artifact and copy bios/* into app/src/main/assets/grub/.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install boot-loader toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq grub-pc-bin grub-common qemu-system-x86 mtools dosfstools fdisk python3

      - name: Build + verify blobs
        run: bash native/scripts/build-bios-blobs.sh out

      - name: Upload blobs
        uses: actions/upload-artifact@v4
        with:
          name: bios-boot-blobs
          path: |
            out/bios/**
            out/qemu.log
          if-no-files-found: error
