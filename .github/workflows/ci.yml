name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: qcow2 engine (unit tests + qemu-img cross checks)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host tools (qemu-img / qemu-io for cross validation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils file
          qemu-img --version | head -1

      - name: Engine unit tests
        run: ./gradlew --no-daemon :qcow2:test

      # ---------------------------------------------------------------- read direction
      - name: qemu-img -> engine (byte exact read of a foreign image)
        run: |
          qemu-img create -f qcow2 -o cluster_size=65536 /tmp/ref.qcow2 32M
          qemu-io -c 'write -P 0xab 0 100000' /tmp/ref.qcow2
          qemu-img convert -f qcow2 -O raw /tmp/ref.qcow2 /tmp/ref.raw
          EXPECTED=$(sha256sum /tmp/ref.raw | cut -d' ' -f1)
          ACTUAL=$(./gradlew -q :qcow2:qcow2Cli --args="verify /tmp/ref.qcow2" 2>/dev/null | grep '^sha256=' | cut -d= -f2)
          echo "qemu-img raw : $EXPECTED"
          echo "mirrorbox    : $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::engine read does not match qemu-img output"
            exit 1
          fi

      # ---------------------------------------------------------------- write direction
      - name: engine -> qemu-img (qemu must accept what we write)
        run: |
          ./gradlew --no-daemon :qcow2:qcow2Cli --args="create /tmp/engine.qcow2 33554432"
          ./gradlew --no-daemon :qcow2:qcow2Cli --args="write /tmp/engine.qcow2 12345 200000"
          ./gradlew --no-daemon :qcow2:qcow2Cli --args="stats /tmp/engine.qcow2"
          qemu-img check /tmp/engine.qcow2
          ./gradlew --no-daemon :qcow2:qcow2Cli --args="verify /tmp/engine.qcow2"

      - name: verification of the engine written payload (read back through qemu-img)
        run: |
          # qemu-img convert is used instead of `dd` on purpose: the byte pattern written at
          # offset 12345 must survive a full round trip through QEMU's own reader.
          qemu-img convert -f qcow2 -O raw /tmp/engine.qcow2 /tmp/engine.raw
          ls -l /tmp/engine.raw
          python3 - /tmp/engine.raw <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read()
          segment = data[12345:212345]
          expected = bytes(((i * 7 + 13) % 251) for i in range(200000))
          if segment != expected:
              print(f'::error::payload mismatch ({len(segment)} bytes read back)')
              sys.exit(1)
          if any(byte != 0 for byte in data[212345:220000]):
              print('::error::bytes after the written range must stay zero')
              sys.exit(1)
          print('payload verified through qemu-img:', len(segment), 'bytes, trailing region zeroed')
          PY

  apk:
    name: Debug APK (shell only, no native tools)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The preinstalled SDK on GitHub runners is used directly: android-actions/setup-android
      # currently fails with "Failed to find package 'tools'", so we manage the SDK ourselves.
      - name: Prepare Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          sudo mkdir -p "$SDK"
          sudo chown -R "$(id -u):$(id -g)" "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK" || true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirrorbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
