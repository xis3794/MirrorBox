name: Native Toolchain

# Builds the Android native tools (qemu-img, e2fsprogs, dosfstools, mtools,
# ntfsprogs, xorriso + glib/zlib/zstd) and stages them both as a release archive
# and as jniLibs for APK packaging.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI to build'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
  workflow_call:
    inputs:
      abi:
        required: false
        type: string
        default: 'arm64-v8a'

permissions:
  contents: read

env:
  ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk
  ABI: ${{ inputs.abi || 'arm64-v8a' }}

jobs:
  build:
    name: Tools (${{ inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool pkg-config \
            gettext texinfo bison flex file zip unzip wget curl patchelf
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet meson ninja
          meson --version
          ninja --version
          patchelf --version

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: native/src
          key: native-src-${{ hashFiles('native/versions.env') }}

      - name: Set up Android NDK r26d
        run: |
          curl -fL --retry 5 --retry-delay 3 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q /tmp/ndk.zip -d "$(dirname "${ANDROID_NDK_ROOT}")"
          mv "$(dirname "${ANDROID_NDK_ROOT}")/android-ndk-r26d" "${ANDROID_NDK_ROOT}"
          "${ANDROID_NDK_ROOT}/ndk-build" --version || true

      - name: Build native toolchain
        run: bash native/scripts/build-all.sh

      - name: Upload tools archive
        uses: actions/upload-artifact@v4
        with:
          name: mirrorbox-tools-${{ env.ABI }}
          path: |
            native/out/mirrorbox-tools-${{ env.ABI }}.tar.gz
            native/out/mirrorbox-tools-${{ env.ABI }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload jniLibs payload
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ env.ABI }}
          path: app/src/main/jniLibs/${{ env.ABI }}/
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-logs-${{ env.ABI }}
          path: native/out/logs/
          if-no-files-found: ignore