name: Native Toolchain

# Builds the Android native tools (qemu-img, e2fsprogs, dosfstools, mtools,
# ntfsprogs, xorriso + glib/zlib/zstd) and stages them both as a release archive
# and as jniLibs for APK packaging.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI to build'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      targets:
        description: 'Build stages (space separated: deps qemu fstools xorriso)'
        required: false
        default: 'deps qemu fstools xorriso'
        type: string
  workflow_call:
    inputs:
      abi:
        required: false
        type: string
        default: 'arm64-v8a'
      targets:
        required: false
        type: string
        default: 'deps qemu fstools xorriso'

permissions:
  contents: read

env:
  ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk
  ABI: ${{ inputs.abi || 'arm64-v8a' }}
  TARGETS: ${{ inputs.targets || 'deps qemu fstools xorriso' }}

jobs:
  build:
    name: Tools (${{ inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool pkg-config \
            gettext texinfo bison flex file zip unzip wget curl patchelf
          python3 -m pip install --quiet --upgrade pip
          # QEMU's python/qemu.qmp module is installed with 'pip --no-build-isolation -e',
          # which needs a PEP 660 capable backend: setuptools >= 64 (Ubuntu 22.04 ships 59,
          # which silently lacks build_editable) plus meson-python for safety.
          python3 -m pip install --quiet --upgrade "setuptools>=64" wheel meson ninja meson-python pycotap
          python3 -c "import setuptools, mesonpy; print('setuptools', setuptools.__version__)"
          meson --version
          ninja --version
          patchelf --version

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: native/src
          key: native-src-${{ hashFiles('native/versions.env') }}

      # The built prefix is cached so that later iterations (e.g. only qemu changed) do not
      # rebuild glib/libffi from scratch. Individual build functions skip already-built
      # components, so a partially filled cache is harmless.
      - name: Cache built toolchain
        uses: actions/cache@v4
        with:
          path: native/out
          key: native-out-${{ env.ABI }}-${{ hashFiles('native/versions.env') }}

      - name: Set up Android NDK r26d
        run: |
          curl -fL --retry 5 --retry-delay 3 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q /tmp/ndk.zip -d "$(dirname "${ANDROID_NDK_ROOT}")"
          mv "$(dirname "${ANDROID_NDK_ROOT}")/android-ndk-r26d" "${ANDROID_NDK_ROOT}"
          "${ANDROID_NDK_ROOT}/ndk-build" --version || true

      - name: Build native toolchain
        run: bash native/scripts/build-all.sh

      - name: Upload tools archive
        uses: actions/upload-artifact@v4
        with:
          name: mirrorbox-tools-${{ env.ABI }}
          path: |
            native/out/mirrorbox-tools-${{ env.ABI }}.tar.gz
            native/out/mirrorbox-tools-${{ env.ABI }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload jniLibs payload
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ env.ABI }}
          path: app/src/main/jniLibs/${{ env.ABI }}/
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-logs-${{ env.ABI }}
          path: native/out/logs/
          if-no-files-found: ignore