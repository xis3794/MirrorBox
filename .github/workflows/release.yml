name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-arm64:
    uses: ./.github/workflows/native.yml
    with:
      abi: arm64-v8a

  native-x86_64:
    uses: ./.github/workflows/native.yml
    with:
      abi: x86_64

  apk:
    name: Signed APKs
    needs: [ native-arm64, native-x86_64 ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download native toolchains
        uses: actions/download-artifact@v4
        with:
          path: native-downloads
          pattern: jniLibs-*

      - name: Stage jniLibs
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r native-downloads/jniLibs-arm64-v8a app/src/main/jniLibs/arm64-v8a
          cp -r native-downloads/jniLibs-x86_64 app/src/main/jniLibs/x86_64
          echo "arm64 tools: $(ls app/src/main/jniLibs/arm64-v8a | wc -l)"
          echo "x86_64 tools: $(ls app/src/main/jniLibs/x86_64 | wc -l)"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p keys
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keys/mirrorbox.jks
          fi
          if [ -n "$KEYSTORE_PROPERTIES" ]; then
            printf '%s' "$KEYSTORE_PROPERTIES" > keys/keystore.properties
          fi
          ls -l keys || true

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mirrorbox-apks
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [ apk, native-arm64, native-x86_64 ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: mirrorbox-apks
          path: dist

      - name: Download toolchain archives
        uses: actions/download-artifact@v4
        with:
          pattern: mirrorbox-tools-*
          path: tools
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            tools/*.tar.gz
            tools/*.sha256
          body: |
            ## 镜像匣 MirrorBox ${{ github.ref_name }}

            不启动虚拟机，直接在手机上预览 / 编辑 / 生成 qcow2 磁盘镜像。

            **Assets**
            - `MirrorBox-*-arm64-v8a.apk`：Android 手机（推荐）
            - `MirrorBox-*-x86_64.apk`：模拟器
            - `MirrorBox-*-universal.apk`：通用包（体积更大）
            - `mirrorbox-tools-*.tar.gz`：独立原生工具链（Termux / 其它场景可用）

            每个 APK 内都包含 qemu-img、e2fsprogs、dosfstools、mtools、ntfsprogs 与 xorriso，
            全部离线运行，无需 root、无需联网。